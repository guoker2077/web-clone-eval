# web-clone-eval 一体化流水线运行环境
#
# 三种用法：
#   ① CLI 工具（单站点闭环、合成 scope、预览）—— pipeline 服务
#   ② 云端异步服务（提交→后台跑→轮询→预览）—— web + worker 服务
#
# CLI 用法（在工程根目录）：
#   构建镜像：     docker compose build
#   跑闭环：       docker compose run --rm pipeline python run.py baidu --max-rounds 2
#   合成 scope：   docker compose run --rm pipeline python synthesize_scope.py <url> "<范围>"
#
# 云端异步用法：
#   起服务：       docker compose up web worker
#   打开 UI：      http://localhost:8000  （填网址+复刻范围，提交后自动跑，完成可一键预览）
#
# 密钥通过 env_file 注入（.env 已被 .gitignore 与 .dockerignore 排除，绝不入镜像）。
# 产物目录与队列 DB 以卷挂载到宿主机，容器删除后结果仍在本地。

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: web-clone-eval:latest
  env_file:
    - .env
  volumes:
    # 流水线产物落回宿主机，便于查看与提交
    - ./output:/app/output
    - ./reports:/app/reports
    - ./prompts:/app/prompts
    # 交付产物（干净源码 + 已构建 dist + README）：随仓库提交的复刻成果
    - ./deliverables:/app/deliverables
    # scopes 双向挂载：宿主机新增/合成的 scope 立即对容器可见
    - ./scopes:/app/scopes
    # 队列 DB + worker 日志：web 与 worker 共享，故放独立 data 卷
    - ./data:/app/data
  environment:
    # web 与 worker 必须指向同一个 SQLite 队列文件
    JOBS_DB: /app/data/jobs.db

services:
  # ① CLI 工具镜像（单站点闭环 / 合成 scope / 预览静态产物）
  #    不开 SSRF_GUARD：CLI 由开发者自己驱动，可复刻 http://localhost 等自有页。
  pipeline:
    <<: *common
    working_dir: /app/pipeline
    ports:
      - "8080:8080"   # 预览复刻产物时用 --service-ports 暴露

  # ② 云端 API + UI（无状态，提交任务、查询进度、预览产物）
  web:
    <<: *common
    working_dir: /app
    # 面向陌生人：开启 SSRF 防御（拦内网/云元数据/保留段 IP）+ 提交配额闸门。
    # 公开前务必设置 BASIC_AUTH_USER/PASS（在 .env 里），否则任何人都能刷你的额度。
    environment:
      JOBS_DB: /app/data/jobs.db
      SSRF_GUARD: "1"
      # 成本/滥用闸门（按需在 .env 覆盖具体阈值）
      QUOTA_GUARD: "1"
      QUOTA_IP_MAX: "5"          # 单 IP 每窗口最多任务数
      QUOTA_IP_WINDOW_SEC: "3600"
      QUOTA_ACTIVE_MAX: "20"     # 全局在途上限（背压）
      QUOTA_DAILY_MAX: "200"     # 全站每日总量（成本总闸）
      # 最小鉴权：从 .env 读；留空则不启用（仅本地调试可留空）
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
    command: >
      uvicorn server.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # ② 云端 worker（认领队列任务，以子进程跑 runner 闭环）
  worker:
    <<: *common
    working_dir: /app
    # worker 抓取任意用户 URL，同样必须开 SSRF 防御。
    # JOB_RLIMIT 给 runner 子进程套 CPU/文件/进程数上限（反 fork 炸弹）。
    # SANDBOX_MODE 默认 subprocess（同容器+rlimit 软隔离）；要强隔离改 docker，
    # 但需给 worker 挂 docker.sock（见 README 加固章节，有提权代价）。
    environment:
      JOBS_DB: /app/data/jobs.db
      SSRF_GUARD: "1"
      JOB_RLIMIT: "1"
      JOB_CPU_SEC: "900"
      JOB_FSIZE_MB: "512"
      JOB_NPROC: "512"
      JOB_TIMEOUT_SEC: "1800"
      # 单 worker 进程内并行跑几条 job。受内存约束：每条 job 峰值约 1~1.5GB
      # （Chromium+npm），16G 机器建议 4~6，2核4G 建议 2。默认 2。
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SANDBOX_MODE: ${SANDBOX_MODE:-subprocess}
    command: >
      python -m server.worker
    # worker 不对外暴露端口；通过 data 卷与 web 共享队列
