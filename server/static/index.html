<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页复刻与一致性评估 · 云端</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0f1117; color: #e6e6e6; line-height: 1.5; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 24px; }
  .card { background: #171a23; border: 1px solid #242836; border-radius: 12px;
          padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #b8c0d4; margin: 12px 0 6px; }
  input, textarea { width: 100%; background: #0f1117; border: 1px solid #2c3140;
          color: #e6e6e6; border-radius: 8px; padding: 10px 12px; font-size: 14px;
          font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button { margin-top: 16px; background: #3b82f6; color: #fff; border: none;
          border-radius: 8px; padding: 11px 20px; font-size: 14px; cursor: pointer;
          font-weight: 500; }
  button:hover { background: #2f74e6; }
  button:disabled { background: #2c3140; color: #6b7280; cursor: not-allowed; }
  .jobs { display: flex; flex-direction: column; gap: 10px; }
  .job { background: #171a23; border: 1px solid #242836; border-radius: 10px;
         padding: 14px 16px; }
  .job-head { display: flex; justify-content: space-between; align-items: center;
         gap: 12px; }
  .job-title { font-size: 14px; font-weight: 500; word-break: break-all; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
  .b-queued { background: #374151; color: #d1d5db; }
  .b-running { background: #1e3a5f; color: #7cc0ff; }
  .b-done { background: #14432a; color: #6ee7a8; }
  .b-failed { background: #4a1d1d; color: #ff9b9b; }
  .stage { font-size: 12px; color: #8b93a7; margin-top: 6px; }
  .logbox { margin-top: 10px; background: #0b0d13; border-radius: 6px; padding: 8px 10px;
         font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
         color: #9aa4bb; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  .acts { margin-top: 10px; display: flex; gap: 10px; }
  .acts a { font-size: 13px; color: #7cc0ff; text-decoration: none;
         border: 1px solid #2c3140; border-radius: 6px; padding: 5px 12px; }
  .acts a:hover { background: #1e3a5f; }
  .err { color: #ff9b9b; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  .empty { color: #6b7280; font-size: 13px; text-align: center; padding: 20px; }
  .fb { margin-top: 12px; border-top: 1px solid #242836; padding-top: 12px; }
  .fb-input { min-height: 48px; font-size: 13px; }
  .fb-btn { margin-top: 8px; padding: 7px 14px; font-size: 13px; }
  .fb-msg { font-size: 12px; color: #6ee7a8; margin-left: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>网页复刻与一致性评估</h1>
  <div class="sub">输入网址 + 一句复刻范围，云端自动合成 scope → 复刻 → 评估 → 闭环精修。</div>

  <div class="card">
    <label>目标网址</label>
    <input id="url" placeholder="https://github.com/login" />
    <label>复刻范围（自然语言）</label>
    <textarea id="scope" placeholder="复刻用户名/密码输入框、登录按钮，验证登录交互与必填校验"></textarea>
    <div class="row">
      <div><label>最大精修轮数</label><input id="rounds" type="number" value="2" min="1" max="5" /></div>
      <div><label>达标阈值</label><input id="threshold" type="number" value="85" min="0" max="100" /></div>
    </div>
    <button id="submit">提交复刻任务</button>
    <div class="err" id="formErr"></div>
  </div>

  <div class="jobs" id="jobs"><div class="empty">还没有任务，提交一个试试。</div></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
